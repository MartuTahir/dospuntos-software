<header class="fixed top-0 z-40 w-full bg-background/85 shadow-sm backdrop-blur-md">
  <div
    class="mx-auto flex h-20 max-w-container-max items-center justify-between px-margin-mobile md:px-margin-desktop"
  >
    <a
      href="#"
      class="flex min-h-[44px] items-center text-headline-md font-bold text-primary"
      aria-label="DosPuntos, ir al inicio"
    >
      Dos<span class="text-primary-container">:</span>Puntos
    </a>

    <nav class="hidden items-center gap-stack-lg md:flex" aria-label="Principal">
      @for (enlace of navegacion; track enlace.ancla) {
        <a
          [href]="enlace.ancla"
          class="text-label-md text-on-surface-variant transition-colors hover:text-primary"
        >
          {{ enlace.texto }}
        </a>
      }
      <a
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener"
        class="rounded-full bg-primary-container px-6 py-3 text-label-md text-on-primary shadow-ambient transition-transform hover:scale-[1.03] active:scale-95"
      >
        Escribinos
      </a>
    </nav>

    <button
      type="button"
      class="p-2 text-primary md:hidden"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="menu-movil"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="alternarMenu()"
    >
      <lucide-icon [name]="menuAbierto() ? 'X' : 'Menu'" [size]="28" />
    </button>
  </div>

  @if (menuAbierto()) {
    <nav
      id="menu-movil"
      class="border-t border-outline-variant/40 bg-background px-margin-mobile pb-stack-lg pt-stack-md md:hidden"
      aria-label="Principal"
    >
      @for (enlace of navegacion; track enlace.ancla) {
        <a
          [href]="enlace.ancla"
          (click)="cerrarMenu()"
          class="block py-3 text-body-md text-on-surface-variant transition-colors hover:text-primary"
        >
          {{ enlace.texto }}
        </a>
      }
      <a
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener"
        (click)="cerrarMenu()"
        class="mt-stack-md block rounded-full bg-primary-container py-3 text-center text-label-md text-on-primary"
      >
        Escribinos por WhatsApp
      </a>
    </nav>
  }
</header>
